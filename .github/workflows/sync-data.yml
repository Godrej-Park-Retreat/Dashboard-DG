name: Sync DG Data

on:
  workflow_dispatch:
  schedule:
    # Run at 09:00, 10:00, 11:00 and 12:00 Asia/Kolkata time every day
    - cron: '0 9-12 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync public Google Sheet
        env:
          GOOGLE_SHEET_ID: "1ewUi24xgWh2FVODrjkP7OPzrvfHW7DrM"
        run: python scripts/sync_sheet.py

      - name: Commit updated data
        run: |
          git config user.name "DG Dashboard Bot"
          git config user.email "actions@github.com"
          git add site/data/dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync DG data"
          git push
