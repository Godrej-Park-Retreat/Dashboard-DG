name: Sync DG Data

on:
  workflow_dispatch:
  schedule:
    # Run at 09:00, 10:00, 11:00 and 12:00 Asia/Kolkata time every day
    - cron: '0 9-12 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync public Google Sheet
        env:
          GOOGLE_SHEET_ID: "1ewUi24xgWh2FVODrjkP7OPzrvfHW7DrM"
        run: python scripts/sync_sheet.py

      - name: Commit updated data
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          if [ -z "$REPO_PAT" ]; then
            echo "ERROR: REPO_PAT secret is not configured. Pushes from this workflow will not trigger deployments."
            echo "Please add a repository secret named REPO_PAT with a personal access token (repo scope)."
            exit 1
          fi
          git config user.name "DG Dashboard Bot"
          git config user.email "actions@github.com"
          git add site/data/dashboard.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync DG data"
          # configure origin to use PAT for pushing so the push behaves like a real user
          git remote set-url origin https://x-access-token:${REPO_PAT}@github.com/${{ github.repository }}
          git push origin HEAD:master
