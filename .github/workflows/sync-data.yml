name: Sync DG Data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. These cover ~09:30-12:30 IST.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync public Google Sheet
        env:
          GOOGLE_SHEET_ID: "1ewUi24xgWh2FVODrjkP7OPzrvfHW7DrM"
        run: python scripts/sync_sheet.py

      - name: Commit updated data
        run: |
          git config user.name "DG Dashboard Bot"
          git config user.email "actions@github.com"
          git add site/data/dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync DG data"
          git push
